downConfUrl =

world_sid = ${WORLD_SID:-10001}
zone_sid = ${ZONE_SID:-20001}
game_sid = ${GAME_SERVER_ID:-1}

GameServer.RefPath = conf/data
GameServer.Maps = conf/map
