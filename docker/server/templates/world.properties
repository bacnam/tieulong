# Generated by docker/server/entrypoint.sh from environment variables.
ServerID_Int = 0
ServerID_Str = world

Platform=Web

# GM HTTP port
Server.HttpServer = ${WORLD_HTTP_PORT:-9003}

DB_URL=jdbc:mysql://${DB_HOST:-mysql}:${DB_PORT:-3306}/${WORLD_DB:-tieulong_dbhunkftalk}?useUnicode=true&characterEncoding=utf8&autoReconnect=true&failOverReadOnly=false
DB_USER=${DB_USER:-root}
DB_PASSWORD=${DB_PASSWORD}

LOGDB_URL=jdbc:mysql://${DB_HOST:-mysql}:${DB_PORT:-3306}/${WORLD_LOG_DB:-tieulong_dbhunkftalk_log}?useUnicode=true&characterEncoding=utf8&autoReconnect=true&failOverReadOnly=false
LOGDB_USER=${DB_USER:-root}
LOGDB_PASSWORD=${DB_PASSWORD}

# Port game servers connect to
WorldServer.GameServer_Port= ${WORLD_PORT:-8003}
